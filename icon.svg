<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Swap Enter and Shift+Enter">
  <title>Swap Enter and Shift+Enter</title>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#1f6feb" />
  <!-- downward arrow: the line-break gesture -->
  <path d="M22 15v20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <path d="M12 27l10 11 10-11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- upward arrow: the send gesture -->
  <path d="M42 49V29" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <path d="M32 37l10-11 10 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
